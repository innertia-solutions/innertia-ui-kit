name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - ui
          - theme
          - both
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get npm OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Release ui
        if: ${{ inputs.package == 'ui' || inputs.package == 'both' }}
        working-directory: packages/ui
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          npm publish --access public --provenance
          echo "UI_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        env:
          NODE_AUTH_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Release theme
        if: ${{ inputs.package == 'theme' || inputs.package == 'both' }}
        working-directory: packages/theme
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          npm publish --access public --provenance
          echo "THEME_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        env:
          NODE_AUTH_TOKEN: ${{ steps.oidc.outputs.token }}

      - name: Commit and push version bump
        run: |
          git add packages/ui/package.json packages/theme/package.json

          if [ "${{ inputs.package }}" = "both" ]; then
            MSG="chore: release ui@${{ env.UI_VERSION }} theme@${{ env.THEME_VERSION }}"
          elif [ "${{ inputs.package }}" = "ui" ]; then
            MSG="chore: release ui@${{ env.UI_VERSION }}"
          else
            MSG="chore: release theme@${{ env.THEME_VERSION }}"
          fi

          git commit -m "$MSG"
          git push
