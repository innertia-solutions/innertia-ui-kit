name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma-separated: core,app,saas,themes) or "all"'
        required: true
        default: 'all'
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    environment: NPM
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --no-frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          INPUT="${{ inputs.packages }}"
          if [ "$INPUT" = "all" ]; then
            PACKAGES=(core app saas themes)
          else
            IFS=',' read -ra PACKAGES <<< "$INPUT"
          fi

          BUMPED_FILES=""
          RELEASE_NOTES=""

          for pkg in "${PACKAGES[@]}"; do
            pkg=$(echo "$pkg" | tr -d ' ')
            DIR="packages/$pkg"

            if [ ! -f "$DIR/package.json" ]; then
              echo "Package $pkg not found — skipping"
              continue
            fi

            echo "Publishing $DIR"
            cd "$DIR"

            npm version ${{ inputs.bump }} --no-git-tag-version
            npm publish --access public --provenance

            PKG_NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            echo "✓ $PKG_NAME@$VERSION"

            BUMPED_FILES="$BUMPED_FILES $DIR/package.json"
            RELEASE_NOTES="$RELEASE_NOTES $PKG_NAME@$VERSION"

            cd -
          done

          echo "bumped_files=$BUMPED_FILES" >> $GITHUB_OUTPUT
          echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: Commit and push version bumps
        if: steps.publish.outputs.bumped_files != ''
        run: |
          pnpm install --no-frozen-lockfile
          git add ${{ steps.publish.outputs.bumped_files }} pnpm-lock.yaml
          git commit -m "chore: release${{ steps.publish.outputs.release_notes }}"
          git push
