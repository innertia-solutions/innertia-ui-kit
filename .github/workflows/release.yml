name: Release

on:
  workflow_dispatch:
    inputs:
      core:
        description: 'nuxt-core'
        type: boolean
        default: false
      app:
        description: 'nuxt-app'
        type: boolean
        default: false
      saas:
        description: 'nuxt-saas'
        type: boolean
        default: false
      themes:
        description: 'nuxt-themes'
        type: boolean
        default: false
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    environment: NPM
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --no-frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          BUMPED_FILES=""
          RELEASE_NOTES=""

          for pkg in core app saas themes; do
            # Read the matching boolean input
            INPUT_VAR="${pkg}"
            ENABLED="${{ inputs.core }}"
            [ "$pkg" = "app" ]    && ENABLED="${{ inputs.app }}"
            [ "$pkg" = "saas" ]   && ENABLED="${{ inputs.saas }}"
            [ "$pkg" = "themes" ] && ENABLED="${{ inputs.themes }}"

            [ "$ENABLED" != "true" ] && continue

            DIR="packages/$pkg"

            echo "Publishing $DIR"
            cd "$DIR"

            npm version ${{ inputs.bump }} --no-git-tag-version
            npm publish --access public --provenance

            PKG_NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            echo "✓ $PKG_NAME@$VERSION"

            BUMPED_FILES="$BUMPED_FILES $DIR/package.json"
            RELEASE_NOTES="$RELEASE_NOTES $PKG_NAME@$VERSION"

            cd -
          done

          echo "bumped_files=$BUMPED_FILES" >> $GITHUB_OUTPUT
          echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT

      - name: Commit and push version bumps
        if: steps.publish.outputs.bumped_files != ''
        run: |
          pnpm install --no-frozen-lockfile
          git add ${{ steps.publish.outputs.bumped_files }} pnpm-lock.yaml
          git commit -m "chore: release${{ steps.publish.outputs.release_notes }}"
          git push
